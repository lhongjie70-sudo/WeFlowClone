<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WeFlowClone · 内置机器人</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --line: #e5e6eb;
    --text: #1d2129;
    --muted: #86909c;
    --green: #07c160;
    --green-dark: #06ad56;
    --blue: #165dff;
    --danger: #f53f3f;
    --shadow: 0 6px 24px rgba(0, 0, 0, .08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    height: 56px;
    flex: 0 0 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--green), #34d399);
    display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700;
  }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9cdd4; }
  .dot.ok { background: var(--green); }
  .dot.warn { background: #ff7d00; }
  .grow { flex: 1; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 9px; transition: .15s;
  }
  button:hover { border-color: #c9cdd4; background: #f7f8fa; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.primary:hover { background: var(--green-dark); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.ghost:hover { background: #f2f3f5; color: var(--text); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- 聊天区 ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .empty {
    margin: auto; text-align: center; color: var(--muted); max-width: 520px;
  }
  .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
  .empty p { margin: 6px 0; font-size: 13px; }
  .kbd {
    display: inline-block; padding: 1px 6px; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 6px; font-size: 12px; background: #fafafa;
  }

  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 8px; flex: 0 0 32px;
    display: grid; place-items: center; font-size: 13px; color: #fff;
    background: #c9cdd4; user-select: none;
  }
  .row.me .avatar { background: var(--green); }
  .bubble {
    max-width: min(72%, 620px);
    padding: 9px 13px;
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.me .bubble { background: #95ec69; box-shadow: none; }
  .bubble.err { background: #ffece8; color: #a8071a; }
  .meta { font-size: 11px; color: var(--muted); margin: 4px 2px 0; }
  .row.me .meta { text-align: right; }
  .typing::after {
    content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 输入区 ---------- */
  footer {
    flex: 0 0 auto;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .composer {
    display: flex; gap: 10px; align-items: flex-end;
    max-width: 980px; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; max-height: 160px; min-height: 44px;
    padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; line-height: 1.5; outline: none; background: #fafbfc;
  }
  textarea:focus { border-color: var(--green); background: #fff; }
  .hint { max-width: 980px; margin: 6px auto 0; font-size: 11px; color: var(--muted); display: flex; gap: 12px; }

  /* ---------- 设置面板 ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .35);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: min(560px, 100%); max-height: 86vh; overflow-y: auto;
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px;
  }
  .sheet h3 { margin: 0 0 4px; font-size: 17px; }
  .sheet .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input[type="text"], .field input[type="password"], .field input[type="number"], .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 9px; font: inherit; background: #fafbfc; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); background: #fff; }
  .field .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .inline { display: flex; gap: 10px; align-items: center; }
  .inline > * { flex: 1; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .switch input { width: auto; flex: 0; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .test-result { font-size: 12px; margin-top: 10px; padding: 9px 11px; border-radius: 9px; background: #f7f8fa; display: none; }
  .test-result.show { display: block; }
  .test-result.ok { background: #e8ffea; color: #0e7a3d; }
  .test-result.bad { background: #ffece8; color: #a8071a; }

  .banner {
    max-width: 980px; margin: 0 auto 10px; padding: 10px 12px;
    background: #fff7e8; border: 1px solid #ffe4ba; color: #8a5a00;
    border-radius: 10px; font-size: 13px; display: none;
  }
  .banner.show { display: block; }
  .banner a { color: #8a5a00; font-weight: 600; }
  @media (max-width: 560px) {
    .bubble { max-width: 82%; }
    header { padding: 0 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">W</span>WeFlowClone</div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在连接…</span></div>
  <div class="grow"></div>
  <button class="ghost" id="btnReindex" title="重新扫描聊天记录">重新学习</button>
  <button class="ghost" id="btnNew" title="清空当前对话">新对话</button>
  <button id="btnSettings">设置</button>
</header>

<main id="chat"></main>

<footer>
  <div class="banner" id="banner">
    还没配置模型 API。点右上角「设置」填入 API Key 就能开始聊天（不需要显卡、不需要训练）。
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="btnSend">发送</button>
  </div>
  <div class="hint">
    <span id="modelHint">模型：—</span>
    <span id="personaHint">人设：—</span>
    <span>数据只在本机</span>
  </div>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>机器人设置</h3>
    <div class="sub">填任意 OpenAI 兼容接口即可。Key 只保存在本机 data/bot/config.json。</div>

    <div class="field">
      <label>API 地址（api_base）</label>
      <input type="text" id="apiBase" placeholder="https://api.deepseek.com/v1" />
      <div class="note">DeepSeek / Moonshot / 通义 / OpenAI / Ollama 都行，通常以 /v1 结尾。</div>
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-…" autocomplete="off" />
      <div class="note" id="keyNote">留空表示不修改已保存的 Key。</div>
    </div>
    <div class="field">
      <label>模型名</label>
      <input type="text" id="model" placeholder="deepseek-chat" />
    </div>
    <div class="inline">
      <div class="field">
        <label>温度 <span id="tempValue">0.75</span></label>
        <input type="number" id="temperature" min="0" max="2" step="0.05" />
      </div>
      <div class="field">
        <label>参考条数</label>
        <input type="number" id="topK" min="0" max="8" step="1" />
      </div>
      <div class="field">
        <label>最大长度</label>
        <input type="number" id="maxTokens" min="32" max="4096" step="32" />
      </div>
    </div>
    <div class="field">
      <label>机器人自称（可选）</label>
      <input type="text" id="botName" placeholder="留空则用「我」" />
    </div>
    <div class="field">
      <label>额外要求（可选）</label>
      <textarea id="extraSystem" rows="3" placeholder="例如：不要用「哈哈」，我从来不这么说话"></textarea>
    </div>
    <div class="field">
      <label class="switch"><input type="checkbox" id="usePersona" /> 使用聊天记录学到的说话习惯</label>
    </div>

    <div class="test-result" id="testResult"></div>

    <div class="actions">
      <button id="btnTest">测试连接</button>
      <button class="primary" id="btnSave">保存</button>
      <button class="ghost" id="btnClose">关闭</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  load() {
    try { return JSON.parse(localStorage.getItem("wfc.history") || "[]"); } catch { return []; }
  },
  save(history) { localStorage.setItem("wfc.history", JSON.stringify(history.slice(-200))); },
};

let state = { config: {}, health: {}, history: store.load(), busy: false };

/* ---------------- 渲染 ---------------- */
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function render(text) {
  return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function nowLabel() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function addBubble(role, text, { error = false } = {}) {
  const empty = document.querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = "row" + (role === "user" ? " me" : "");
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "我" : (state.config.bot_name || "W");
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (error ? " err" : "");
  bubble.innerHTML = render(text);
  const wrap = document.createElement("div");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = nowLabel();
  wrap.appendChild(bubble);
  wrap.appendChild(meta);
  row.appendChild(avatar);
  row.appendChild(wrap);
  $("chat").appendChild(row);
  scrollToBottom();
  return bubble;
}
function scrollToBottom() {
  const el = $("chat");
  el.scrollTop = el.scrollHeight;
}
function renderAll() {
  $("chat").innerHTML = "";
  if (!state.history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<h2>${state.health.persona_ready ? "像你一样聊天" : "先让机器人认识你"}</h2>
      <p>${state.health.persona_ready
        ? `已从 ${state.health.persona_messages} 条你的消息里学到说话习惯。`
        : "运行 <b>wfc pull</b> 从 WeFlow 导入聊天记录，机器人会学习你的说话方式。"}</p>
      <p>配置 API Key 后即可对话：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行。</p>`;
    $("chat").appendChild(empty);
    return;
  }
  for (const item of state.history) addBubble(item.role, item.content, { error: !!item.error });
}
function setStatus(ok, text) {
  $("dot").className = "dot " + (ok ? "ok" : "warn");
  $("statusText").textContent = text;
}

/* ---------------- 状态 ---------------- */
async function loadState() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    state.config = data.config || {};
    state.health = data.health || {};
    const cfg = state.config;
    $("modelHint").textContent = "模型：" + (cfg.model || "—");
    $("personaHint").textContent = state.health.persona_ready
      ? `人设：${state.health.persona_messages} 条 / ${state.health.examples} 组样例`
      : "人设：未学习";
    if (cfg.configured) setStatus(true, `${cfg.model} · 就绪`);
    else { setStatus(false, "未配置 API"); $("banner").classList.add("show"); }
    fillForm();
  } catch (err) {
    setStatus(false, "服务未响应");
  }
}
function fillForm() {
  const c = state.config;
  $("apiBase").value = c.api_base || "";
  $("apiKey").value = "";
  $("apiKey").placeholder = c.api_key ? `已保存（${c.api_key}）` : "sk-…";
  $("model").value = c.model || "";
  $("temperature").value = c.temperature ?? 0.75;
  $("tempValue").textContent = c.temperature ?? 0.75;
  $("topK").value = c.retrieve_top_k ?? 3;
  $("maxTokens").value = c.max_tokens ?? 512;
  $("botName").value = c.bot_name || "";
  $("extraSystem").value = c.extra_system || "";
  $("usePersona").checked = c.use_persona !== false;
}

/* ---------------- 设置 ---------------- */
$("btnSettings").onclick = () => { fillForm(); $("overlay").classList.add("show"); };
$("btnClose").onclick = () => $("overlay").classList.remove("show");
$("overlay").onclick = (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("show"); };
$("temperature").oninput = () => { $("tempValue").textContent = $("temperature").value; };

function formPayload() {
  const payload = {
    api_base: $("apiBase").value.trim(),
    model: $("model").value.trim(),
    temperature: parseFloat($("temperature").value || "0.75"),
    top_k: undefined,
    retrieve_top_k: parseInt($("topK").value || "3", 10),
    max_tokens: parseInt($("maxTokens").value || "512", 10),
    bot_name: $("botName").value.trim(),
    extra_system: $("extraSystem").value,
    use_persona: $("usePersona").checked,
  };
  delete payload.top_k;
  const key = $("apiKey").value.trim();
  if (key) payload.api_key = key;
  return payload;
}

$("btnSave").onclick = async () => {
  $("btnSave").disabled = true;
  try {
    const res = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formPayload()),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    state.config = data.config;
    $("banner").classList.toggle("show", !data.config.configured);
    setStatus(data.config.configured, data.config.configured ? `${data.config.model} · 就绪` : "未配置 API");
    $("modelHint").textContent = "模型：" + data.config.model;
    $("overlay").classList.remove("show");
    toast("已保存");
  } catch (err) {
    toast("保存失败：" + err.message, true);
  } finally {
    $("btnSave").disabled = false;
  }
};

$("btnTest").onclick = async () => {
  const box = $("testResult");
  box.className = "test-result show";
  box.textContent = "正在测试…";
  $("btnTest").disabled = true;
  try {
    // 先保存，确保用的是新填的 Key
    await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formPayload()),
    });
    const res = await fetch("/api/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const data = await res.json();
    if (data.ok) {
      box.className = "test-result show ok";
      box.textContent = `连接成功（${data.latency_ms} ms）：${data.reply || "OK"}`;
      await loadState();
    } else {
      box.className = "test-result show bad";
      box.textContent = data.error || "连接失败";
    }
  } catch (err) {
    box.className = "test-result show bad";
    box.textContent = err.message;
  } finally {
    $("btnTest").disabled = false;
  }
};

/* ---------------- 聊天 ---------------- */
async function send() {
  if (state.busy) return;
  const text = $("input").value.trim();
  if (!text) return;

  $("input").value = "";
  autoGrow();
  state.busy = true;
  $("btnSend").disabled = true;

  state.history.push({ role: "user", content: text });
  store.save(state.history);
  addBubble("user", text);

  const bubble = addBubble("assistant", "");
  bubble.classList.add("typing");
  let answer = "";
  let failed = false;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: state.history.slice(0, -1) }),
    });
    if (!res.ok || !res.body) {
      const detail = await res.text().catch(() => "");
      throw new Error(detail || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() || "";
      for (const part of parts) {
        const line = part.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        let payload;
        try { payload = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (payload.delta) {
          answer += payload.delta;
          bubble.innerHTML = render(answer);
          scrollToBottom();
        } else if (payload.error) {
          failed = true;
          bubble.classList.add("err");
          bubble.textContent = payload.error;
        }
      }
    }
  } catch (err) {
    failed = true;
    bubble.classList.add("err");
    bubble.textContent = "出错了：" + err.message;
  } finally {
    bubble.classList.remove("typing");
    state.busy = false;
    $("btnSend").disabled = false;
    $("input").focus();
    if (!failed && answer) {
      state.history.push({ role: "assistant", content: answer });
      store.save(state.history);
    }
    scrollToBottom();
  }
}

$("btnSend").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
function autoGrow() {
  const el = $("input");
  el.style.height = "auto";
  el.style.height = Math.min(160, el.scrollHeight) + "px";
}
$("input").addEventListener("input", autoGrow);

$("btnNew").onclick = () => {
  state.history = [];
  store.save(state.history);
  renderAll();
  toast("已开始新对话");
};
$("btnReindex").onclick = async () => {
  $("btnReindex").disabled = true;
  try {
    const res = await fetch("/api/reindex", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    toast(`重新学习完成：${data.stats.messages} 条消息 / ${data.stats.examples} 组样例`);
    await loadState();
  } catch (err) {
    toast("失败：" + err.message, true);
  } finally {
    $("btnReindex").disabled = false;
  }
};

/* ---------------- 小提示 ---------------- */
let toastTimer = null;
function toast(text, isError = false) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;background:rgba(0,0,0,.78);color:#fff;font-size:13px;z-index:99;transition:.2s";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.background = isError ? "rgba(190,20,20,.9)" : "rgba(0,0,0,.78)";
  el.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2400);
}

/* ---------------- 启动 ---------------- */
renderAll();
loadState();
$("input").focus();
// 深链接：/#settings 直接打开设置面板（方便截图、也方便分享「来这儿填 Key」）
if (location.hash === "#settings" || location.hash === "#config") {
  $("overlay").classList.add("show");
}
</script>
</body>
</html>
