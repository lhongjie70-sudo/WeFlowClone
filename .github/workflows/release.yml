name: Release

# 仓库只放源码；打 tag 时由 CI 构建三平台产物并挂到 GitHub Releases。
# 下载页的 zip / dmg 全部来自这里，不存在「本地打包再手传」的路径。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: WeFlowClone-win64
          # macos-13 = Intel；若 GitHub 退役该镜像，改成 macos-15-intel
          - os: macos-13
            label: macOS x86_64
            artifact: WeFlowClone-macos-x86_64
          - os: macos-14
            label: macOS arm64
            artifact: WeFlowClone-macos-arm64
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install --quiet pyyaml

      - name: 校验 tag 与代码版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_tag.py

      - name: 单元测试
        run: python -m unittest discover -s tests -t tests

      - name: 构建（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build.ps1

      - name: 构建（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x packaging/build.sh
          ./packaging/build.sh

      - name: 生成 SHA256 校验和
        run: python scripts/make_checksums.py --dir dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 |
            | --- | --- |
            | Windows 10/11 x64 | `WeFlowClone-*-win64.zip` → 解压后双击 `WeFlowClone\WeFlowClone.exe` |
            | macOS Apple Silicon | `WeFlowClone-*-macos-arm64.dmg`（或同名 `.zip`） |
            | macOS Intel | `WeFlowClone-*-macos-x86_64.dmg`（或同名 `.zip`） |

            校验和见 `SHA256SUMS.txt`。macOS 首次打开请 **右键 → 打开**（应用未签名）。

            ## 三步用起来

            1. 启动程序，浏览器自动打开 `http://127.0.0.1:8765`；
            2. 右上角「设置」→ 填 **API 地址 / API Key / 模型名** → 测试连接 → 保存；
            3. 开始聊天。

            > 想让它「像你」：装好 [WeFlow](https://github.com/hicccc77/WeFlow) 并开启 API 服务，
            > 设置 `WEFLOW_TOKEN` 后运行 `WeFlowClone pull`，再 `WeFlowClone bot --reindex`。
            >
            > 想改代码 / 自己训练：仓库就是源码，见 `CONTRIBUTING.md` 与 `docs/`。
            >
            > 许可：本项目 AGPL-3.0（含 WeClone），对接 CC BY-NC-SA 4.0 的 WeFlow，**不可商用**。
