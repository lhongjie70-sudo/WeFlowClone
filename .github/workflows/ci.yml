name: CI

# 每次 push / PR 都跑：静态检查 + 全量测试。
# 它是发布前的第一道门 —— release.yml 只在打 tag 时跑，别等到那时才发现问题。
on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install --quiet pyyaml

      - name: 静态检查 + 测试
        run: python scripts/release_check.py --no-artifacts

      - name: 语法检查（所有模块可编译）
        run: python -m compileall -q weflow_clone tests scripts
