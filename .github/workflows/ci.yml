name: CI

# 每次 push / PR 都跑：测试 + 静态检查。
# 它是发布前的第一道门 —— release.yml 只在打 tag 时跑，别等到那时才发现问题。
on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    env:
      # Windows runner 的管道默认 cp1252，中文输出会抛 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装校验依赖
        run: python -m pip install --quiet pyyaml

      - name: 单元测试
        run: python -m unittest discover -s tests -t tests

      - name: 发布前静态检查
        run: python scripts/release_check.py --no-tests --no-artifacts

      - name: 语法检查
        run: python -m compileall -q weflow_clone tests scripts

      - name: 保存检查输出（失败时便于排查）
        if: always()
        run: python scripts/release_check.py --no-tests --no-artifacts > check-output.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-output-${{ matrix.os }}
          path: check-output.txt
          if-no-files-found: ignore
